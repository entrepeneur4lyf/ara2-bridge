[package]
name = "ara2-bridge-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe ARA host authoring runtime"
license.workspace = true
repository.workspace = true

[dependencies]
ara2-bridge-core = { path = "../ara2-bridge-core", version = "=0.3.0" }
ara2-bridge-sys = { path = "../ara2-bridge-sys", version = "=0.3.0" }
bitflags.workspace = true

[dev-dependencies]
# Path-only by design: publishing this dev-only fixture would create a package cycle because the
# testkit depends on the host runtime. Cargo omits path-only dev-dependencies from the crate.
ara2-bridge-testkit = { path = "../ara2-bridge-testkit" }
