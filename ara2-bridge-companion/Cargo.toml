[package]
name = "ara2-bridge-companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLAP, VST3, and Audio Unit adapters for ara2-bridge"
license.workspace = true
repository.workspace = true

[features]
default = []
host = ["dep:ara2-bridge-host"]
plugin = ["dep:ara2-bridge-plugin"]
clap = []
vst3 = []
audio-unit-v2 = []

[dependencies]
ara2-bridge-core = { path = "../ara2-bridge-core", version = "=0.3.0" }
ara2-bridge-sys = { path = "../ara2-bridge-sys", version = "=0.3.0" }
ara2-bridge-host = { path = "../ara2-bridge-host", version = "=0.3.0", optional = true }
ara2-bridge-plugin = { path = "../ara2-bridge-plugin", version = "=0.3.0", optional = true }
bitflags.workspace = true

[build-dependencies]
cc.workspace = true
