[workspace]
members = [
    "ara2-bridge-sys",
    "ara2-bridge-core",
    "ara2-bridge-plugin",
    "ara2-bridge-host",
    "ara2-bridge-companion",
    "ara2-bridge-testkit",
    "ara2-bridge",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/entrepeneur4lyf/ara2-bridge"

[workspace.dependencies]
base64 = "0.22"
# 2.2.1 is the lowest release that also satisfies the bindgen 0.71 requirement.
bitflags = "2.4.0"
bindgen = "0.71"
cargo_metadata = "0.19"
# 1.0.100 is the first release with Build::std and a generic Build::flag, both used by the shims.
cc = "1.0.100"
crossbeam-queue = "0.3"
flate2 = "1"
libc = "0.2.161"
parking_lot = "0.12"
proptest = "=1.5.0"
quick-xml = "0.41"
serde = { version = "1.0.194", features = ["derive"] }
# 1.0.118 is the first release deriving Hash on Value, required by cargo_metadata 0.19.
serde_json = "1.0.118"
serde_yaml = "0.9"
sha2 = "0.10"
static_assertions = "1.1"
tar = "0.4"
tempfile = "=3.14.0"
thiserror = "2"
toml = "0.8"
trybuild = "=1.0.101"
zstd = "0.13"
