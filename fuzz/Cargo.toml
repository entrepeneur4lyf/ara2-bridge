[package]
name = "ara2-bridge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
ara2-bridge-core = { path = "../ara2-bridge-core" }
ara2-bridge-sys = { path = "../ara2-bridge-sys" }
libfuzzer-sys = "0.4"

[[bin]]
name = "versioned_structs"
